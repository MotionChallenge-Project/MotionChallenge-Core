[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "MotionChallenge-Core"
version = "0.1.0"
description = "Auditable motion-controller benchmark contracts and suites"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "robots/LICENSE.mjlab"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.1",
  "scipy==1.16.2",
  "mujoco==3.17.0",
  "onnxruntime==1.30.0",
  "PyYAML==6.0.3",
]

[project.urls]
Repository = "https://github.com/MotionChallenge-Project/MotionChallenge-Core"
Issues = "https://github.com/MotionChallenge-Project/MotionChallenge-Core/issues"

[project.scripts]
motionchallenge = "motion_challenge.cli:main"
motionchallenge-eval = "motion_challenge.run:main"
motionchallenge-merge = "motion_challenge.merge:main"
motionchallenge-verify = "motion_challenge.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/MotionChallenge-Core/suites/lafan" = ["suites/lafan/*.json"]
"share/MotionChallenge-Core/robots" = ["robots/*.json", "robots/*.xml", "robots/LICENSE*"]
