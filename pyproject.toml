[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "MotionChallenge-Core"
version = "0.2.0"
description = "Auditable motion-controller benchmark contracts and suites"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "robots/LICENSE.mjlab"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.4.4",
  "scipy==1.17.1",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "warp-lang==1.18.0",
  "torch==2.14.1",
  "safetensors==0.8.0",
  "onnx==1.21.0",
  "pyarrow==25.0.1",
  "PyYAML==6.0.3",
]

[project.urls]
Repository = "https://github.com/MotionChallenge-Project/MotionChallenge-Core"
Issues = "https://github.com/MotionChallenge-Project/MotionChallenge-Core/issues"

[project.scripts]
motionchallenge-eval = "motion_challenge.runtime.mjwarp_entrypoint:main"
motionchallenge-verify = "motion_challenge.evaluation.tensor_verify:main"
motionchallenge-prepare = "motion_challenge.data.prepare:main"
motionchallenge-reproduce = "motion_challenge.evaluation.reproduction:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/MotionChallenge-Core/suites/lafan" = ["suites/lafan/*.json"]
"share/MotionChallenge-Core/suites/seed" = ["suites/seed/*.json", "suites/seed/*.jsonl.gz"]
"share/MotionChallenge-Core/robots" = ["robots/*.json", "robots/*.xml", "robots/LICENSE*"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
